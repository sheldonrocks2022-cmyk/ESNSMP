name: Publish ESNSMP v2.7.0

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-v2.7.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.7.0 >/dev/null 2>&1; then
            gh release upload v2.7.0 target/ESNSMP.jar --clobber
          else
            gh release create v2.7.0 target/ESNSMP.jar \
              --target "$GITHUB_SHA" \
              --title "ESNSMP v2.7.0" \
              --notes "Adds the admin-test Immortal Warden Bundle. Eight items are available through /esnitems for OP/admin testing only; no Stripe payment link is seeded yet. Includes a fully unbreakable Realm-100-enchanted armor set, Warden Blade, Warden Longbow, Immortal Core, and infinite-use Warden Totem."
          fi
