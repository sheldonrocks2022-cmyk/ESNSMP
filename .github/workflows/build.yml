name: Build ESNSMP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile and verify
        run: mvn -B -ntp clean verify

      - name: Upload ESNSMP JAR
        uses: actions/upload-artifact@v4
        with:
          name: ESNSMP
          path: target/ESNSMP.jar
          if-no-files-found: error
          retention-days: 30

  publish-latest-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified ESNSMP build
        uses: actions/download-artifact@v4
        with:
          name: ESNSMP
          path: release

      - name: Generate public build metadata
        shell: bash
        run: |
          SHA256="$(sha256sum release/ESNSMP.jar | awk '{print $1}')"
          SIZE="$(stat -c%s release/ESNSMP.jar)"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > release/ESNSMP-build.json <<EOF
          {
            "version": "v2.11.1",
            "filename": "ESNSMP.jar",
            "sizeBytes": ${SIZE},
            "sha256": "${SHA256}",
            "source": "github-actions-main",
            "commit": "${GITHUB_SHA}",
            "runId": ${GITHUB_RUN_ID},
            "runNumber": ${GITHUB_RUN_NUMBER},
            "buildUrl": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "builtAt": "${BUILT_AT}"
          }
          EOF

      - name: Publish rolling latest-main release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view latest-main --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-main release/ESNSMP.jar release/ESNSMP-build.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest-main --repo "$GITHUB_REPOSITORY" --title "Latest ESNSMP Main Build" --notes "Automatically updated from the newest verified main-branch build. This rolling prerelease powers the ESN website's latest ESNSMP.jar download."
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest-main" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create latest-main release/ESNSMP.jar release/ESNSMP-build.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Latest ESNSMP Main Build" --notes "Automatically updated from the newest verified main-branch build. This rolling prerelease powers the ESN website's latest ESNSMP.jar download." --prerelease
          fi

