name: Build ESNSMP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and verify
        run: mvn -B -ntp clean verify

      - name: Upload ESNSMP JAR
        uses: actions/upload-artifact@v4
        with:
          name: ESNSMP
          path: target/ESNSMP.jar
          if-no-files-found: error
          retention-days: 14

