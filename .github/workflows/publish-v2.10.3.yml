name: Publish ESNSMP v2.10.3
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/publish-v2.10.3.yml" ]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and verify
        run: mvn -B -ntp clean verify
      - name: Verify v2.10.3 owner tag and weapon tier
        run: |
          set -euo pipefail
          unzip -p target/ESNSMP.jar plugin.yml | grep -F "version: '2.10.3'"
          unzip -p target/ESNSMP.jar plugin.yml | grep -F "  ownertag:"
          jar tf target/ESNSMP.jar | grep -F "com/esn/smp/gameplay/OwnerTagSettings.class"
          jar tf target/ESNSMP.jar | grep -F "com/esn/smp/gameplay/StoreCosmetics.class"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v2.10.3 target/ESNSMP.jar --target "$GITHUB_SHA" --title "ESNSMP v2.10.3" --notes "Adds /ownertag (alias /otag) with a persistent GUI to show or hide the visible ESN Owner tag without changing permissions. Also upgrades ESN Weapon Cosmetic Packs into a Realm 100+ combat tier at 1.95x damage with level-225 Realm-equivalent enchants, while blocking skins on Riftwalker, Immortal Warden and Void Warrior exclusive weapons so the exclusive tier remains stronger."
