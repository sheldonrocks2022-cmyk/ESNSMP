name: Publish ESNSMP v2.9.9
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/publish-v2.9.9.yml" ]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and verify
        run: mvn -B -ntp clean verify
      - name: Verify v2.9.9 metadata and kill effects
        run: |
          set -euo pipefail
          unzip -p target/ESNSMP.jar plugin.yml | grep -F "version: '2.9.9'"
          unzip -p target/ESNSMP.jar plugin.yml | grep -F "api-version: '26.2'"
          unzip -p target/ESNSMP.jar plugin.yml | grep -F "killeffects:"
          jar tf target/ESNSMP.jar | grep -F "com/esn/smp/gameplay/KillEffects.class"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v2.9.9 target/ESNSMP.jar --target "$GITHUB_SHA" --title "ESNSMP v2.9.9" --notes "Adds the ESN Kill Effects system: Lightning Strike, Soul Explosion, Void Implosion, Meteor Strike, Warden Sonic Burst, and Fire Tornado. Includes permanent redeemable store tokens, /killeffects equip/list/preview/off, PvP-only cosmetic triggers, and no damage or block changes."
