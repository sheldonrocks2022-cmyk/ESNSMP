name: Publish ESNSMP v2.10.4
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/publish-v2.10.4.yml" ]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and verify
        run: mvn -B -ntp clean verify
      - name: Verify v2.10.4 collection armor
        run: |
          set -euo pipefail
          unzip -p target/ESNSMP.jar plugin.yml | grep -F "version: '2.10.4'"
          jar tf target/ESNSMP.jar | grep -F "com/esn/smp/gameplay/StoreCosmetics.class"
          jar tf target/ESNSMP.jar | grep -F "com/esn/smp/gameplay/CosmeticsGui.class"
          unzip -p target/ESNSMP.jar config.yml | grep -F "    armor: false"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v2.10.4 target/ESNSMP.jar --target "$GITHUB_SHA" --title "ESNSMP v2.10.4" --notes "Adds matching four-piece Realm 100+ armor sets to all 13 ESN seasonal and named cosmetic collections. Each collection now unlocks aura, title, weapon, and armor. Collection armor uses level-225 Realm-equivalent enchants, is unbreakable, and grants 12% incoming-damage reduction only when the matching full set is worn. Riftwalker, Immortal Warden, and Void Warrior exclusives remain the stronger gear tier."
