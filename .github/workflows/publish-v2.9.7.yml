name: Publish ESNSMP v2.9.7
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/publish-v2.9.7.yml" ]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and verify
        run: mvn -B -ntp clean verify
      - name: Verify Paper 26.3 metadata
        run: |
          set -euo pipefail
          unzip -p target/ESNSMP.jar plugin.yml | grep -F "version: '2.9.7'"
          unzip -p target/ESNSMP.jar plugin.yml | grep -F "api-version: '26.3'"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v2.9.7 target/ESNSMP.jar --target "$GITHUB_SHA" --title "ESNSMP v2.9.7" --notes "DaTHost Stripe configuration compatibility release. ESNSMP can now read the Stripe secret key from plugins/ESNSMP/config.yml at stripe-store.secret-key, while preserving the environment-variable and stripe-key.txt fallbacks. Paper API 26.3 and existing SMP systems remain intact."
