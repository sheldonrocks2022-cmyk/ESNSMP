  weekend:
    description: 'View the current weekend modifier'
  worldthreat:
    aliases: [threat]
    description: 'View the ESN world threat level'
  seasonworld:
    description: 'View the current world season theme'
  seasonfinale:
    description: 'Start or inspect the ESN season finale'
    permission: esnsmp.staff
  luckyblocks:
    description: 'View ESN lucky-block event status'
  relicauction:
    description: 'View or bid in the rotating ESN Relic Auction'
    usage: '/relicauction [bid <coins>]'
  funadmin:
    description: 'Manage ESN fun-expansion systems'
    usage: '/funadmin <status|rebuild|auction>'
    permission: esnsmp.admin

  voice:
    aliases: [voicechat, vc]
    description: 'Open ESN Java + Bedrock proximity voice chat'
    usage: '/voice [connect|code <code>|status|mod|help]'

  realms:
    aliases: [realmsmenu, realmnexus]
    description: 'Open ESN Realms and travel between generated realm worlds'
    usage: '/realms [nexus|storm|abyss|frost|infernal|verdant|celestial|bloodmoon|100|shattered]'  realmprogress:
    aliases: [realmcareer, realmhub, ascensionrealms]
    description: 'Open the complete ESN Realm Ascension progression hub'
    usage: '/realmprogress [realm]'
  realmguide:
    aliases: [realmbestiary, creatures]
    description: 'Show native creatures and dangers in your current ESN Realm'
  realmforge:
    aliases: [sigilforge]
    description: 'Forge Realm Essence and Relic Fragments into permanent Realm Sigils'
    usage: '/realmforge [realm]'
  realmevent:
    description: 'Manage ESN Realm invasions, minibosses and custom mobs'
    usage: '/realmevent [invasion|miniboss|clear] [realm]'
    permission: esnsmp.admin

  realmadmin:
    description: 'Manage ESN Realms worlds and Realm 100 access'
    usage: '/realmadmin <status|tp|rebuild|decorate|unlock100|lock100> [realm]'
    permission: esnsmp.admin

  staffhub:
    aliases: [staffcenter, staffmenu2]
    description: 'Open the ESN Staff & Studio Control Center'
