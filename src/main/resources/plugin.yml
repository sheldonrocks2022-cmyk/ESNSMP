name: ESNSMP
version: '2.8.3'
main: com.esn.smp.ESNSMPPlugin
api-version: '1.21'
author: ESN
description: ESN SMP core, massive spawn, economy and auction house

commands:
  championship:
    aliases: [champ]
    description: 'Staff-activated ESN Server Championship'
    usage: '/championship <start|forfeit|status|cancel>'
  realm:
    description: 'View or advance Realm 1-100 progression'
    usage: '/realm [advance]'
  story:
    aliases: [storyquest, npcquest]
    description: 'View and advance the ESN NPC story questline'
  discoveries:
    aliases: [discovery]
    description: 'View Journal world discoveries'
  guildhq:
    description: 'View or create your Guild Headquarters'
    usage: '/guildhq [create <name>]'
  titlemenu:
    description: 'View unlockable ESN player titles'
  spawn:
    description: Teleport to ESN SMP spawn.
    permission: esnsmp.spawn
  setspawn:
    description: Set ESN SMP spawn.
    permission: esnsmp.admin
  esnspawn:
    description: Manage the ESN SMP spawn.
    usage: /esnspawn <build|rebuild|status|rollback>
    permission: esnsmp.admin
  ah:
    aliases: [auction, auctionhouse]
    description: Open and manage the ESN Auction House.
    usage: /ah [sell <price>|cancel <id>|claim]
    permission: esnsmp.auction
  balance:
    aliases: [bal, money]
    description: View your ESN Coin balance.
    permission: esnsmp.economy
  pay:
    description: Pay ESN Coins to another online player.
    usage: /pay <player> <amount>
    permission: esnsmp.economy

  menu:
    description: 'Open ESN SMP menu'
  shop:
    description: 'Open ESN server shop'
  journal:
    aliases: [adventurejournal]
    description: 'Open your ESN Adventure Journal'
  msg:
    aliases: [tell, whisper, w, pm]
    description: 'Send a private message'
    usage: '/msg <player> <message>'
  reply:
    aliases: [r]
    description: 'Reply to your latest private message'
    usage: '/reply <message>'
  staffchat:
    aliases: [sc]
    description: 'Toggle or send ESN staff chat'
    usage: '/staffchat [message]'
    permission: esnsmp.staff
  globalchat:
    aliases: [gc]
    description: 'Switch to global chat'
  localchat:
    aliases: [lc]
    description: 'Switch to local chat'
  chattoggle:
    aliases: [chat]
    description: 'Toggle receiving public chat'
  chatmenu:
    aliases: [chatsettings]
    description: 'Open the ESN chat settings menu'
  crates:
    description: 'Open ESN loot crates'
  daily:
    description: 'Claim daily ESN reward'
  quests:
    description: 'View ESN quests'
  leaderboard:
    description: 'View ESN leaderboard'
    aliases:
      - top
  warps:
    description: 'List server warps'
  warp:
    description: 'Teleport to a server warp'
    usage: '/warp <name>'
  setwarp:
    description: 'Set a server warp'
    usage: '/setwarp <name>'
    permission: esnsmp.admin
  delwarp:
    description: 'Delete a server warp'
    usage: '/delwarp <name>'
    permission: esnsmp.admin
  sethome:
    description: 'Set a home'
    usage: '/sethome [name]'
  home:
    description: 'Teleport home'
    usage: '/home [name]'
  delhome:
    description: 'Delete a home'
    usage: '/delhome [name]'
  homes:
    description: 'List your homes'
  rtp:
    description: 'Random teleport'
  profile:
    description: 'View your ESN profile'

  level:
    description: 'View ESN level and rank'
  achievements:
    description: 'View ESN achievements'
  streak:
    description: 'View daily login streak'
  team:
    description: 'Manage ESN teams'
    usage: '/team <create|join|leave|info>'
  outlaws:
    aliases: [outlaw]
    description: 'View active ESN outlaws and hunter rewards'
  bounty:
    description: 'View or place player bounties'
    usage: '/bounty [player] [coins]'
  trade:
    description: 'Securely trade held items'
    usage: '/trade <player>'
  grave:
    description: 'View your last death location'
  season:
    description: 'View ESN season progress'
  event:
    aliases: [events]
    description: 'View the current ESN event'
  staff:
    description: 'Open ESN staff command help'
    permission: esnsmp.staff
  invsee:
    description: 'View a player''s inventory'
    permission: esnsmp.staff
  ecsee:
    description: 'View a player''s ender chest'
    permission: esnsmp.staff
  freeze:
    description: 'Freeze a player'
    permission: esnsmp.staff
  warn:
    description: 'Warn a player'
    permission: esnsmp.staff
  mute:
    description: 'Mute a player'
    permission: esnsmp.staff
  history:
    description: 'View moderation history'
    permission: esnsmp.staff

  megacratekey:
    description: Give a Realm crate key.
    usage: /megacratekey <1-100>
    permission: esnsmp.admin

  esnitems:
    description: Give ESN custom items and crate keys.
    usage: /esnitems <item>
    permission: esnsmp.items

  esnram:
    description: Show ESNSMP heap, chunk and custom-entity diagnostics.
    permission: esnsmp.admin

  claim:
    description: Protect your base from griefing and theft.
    usage: /claim <pos1|pos2|create|remove|trust|untrust|info>
    permission: esnsmp.claim

  tpmenu:
    aliases: [teleportmenu, tpagui]
    description: 'Open the ESN teleport request menu'
  tpa:
    description: 'Request teleport to a player'
    usage: '/tpa <player>'
  tpahere:
    description: 'Send a teleport request'
    usage: '/tpahere <player>'
  tpaccept:
    description: 'Accept a teleport request'
  tpdeny:
    description: 'Deny a teleport request'
  back:
    description: 'Return to your previous teleport location'
  tptoggle:
    description: 'Toggle incoming teleport requests'

  pass:
    description: 'Open the ESN Season Pass'
  upgrade:
    description: 'Upgrade the ESN item in your hand'
  tradegui:
    description: 'Open secure player trading'
    usage: '/tradegui <player>'
  tutorial:
    description: 'View the ESN SMP quick-start tutorial'

  jobs:
    description: 'View ESN jobs and job progress'
  skills:
    description: 'View ESN skill progression'
  prestige:
    description: 'Prestige your ESN skills'
  titles:
    description: 'View unlockable player titles'
  collections:
    description: 'View ESN collections'
  bestiary:
    description: 'View ESN mob and boss collection progress'
  stats:
    description: 'View ESN career statistics'
  afk:
    description: 'Toggle AFK status'
  calendar:
    aliases: [eventcalendar]
    description: 'View ESN event calendar'
  blacksmith:
    description: 'Open ESN blacksmith information'
  salvage:
    description: 'Access ESN salvage system'
  reforge:
    description: 'Access ESN reforge system'
  boss:
    description: 'Access ESN boss system'
  dungeon:
    description: 'Access ESN dungeon system'
  raid:
    description: 'Access ESN raid system'
  party:
    description: 'Access ESN party system'
  koth:
    description: 'View ESN King of the Hill system'
  report:
    description: 'Report a player to ESN staff'
    usage: '/report <player> <reason>'
  note:
    description: 'Add a persistent staff note'
    usage: '/note <player> <note>'
    permission: esnsmp.staff

  forge:
    description: 'Forge boss drops into powerful ESN relics'
  bossdrops:
    description: 'View uses for ESN boss drops'
  contracts:
    description: 'View persistent boss contracts'
  relics:
    description: 'View the ESN relic system'
  challenges:
    description: 'View ESN challenge progress'
  rewards:
    description: 'View ESN reward road progress'

  season2:
    description: 'View ESN Season 2 progression'
  milestones:
    description: 'View and claim boss milestones'
  bestiary2:
    description: 'View persistent bestiary'
  achievements2:
    description: 'View 2.0 achievements'
  title:
    description: 'Equip earned titles'
  party2:
    description: 'Use safe party invitations'
  events2:
    description: 'View 2.0 world events'
  guide:
    description: 'View the 2.0 progression path'
  leaderboards2:
    description: 'View 2.0 career standings'
  claimflags:
    description: 'View claim protection features'

  chaos:
    description: 'View the active ESN Chaos modifier'
  artifacts:
    description: 'View ESN boss artifact information'
  runes:
    description: 'View ESN rune information'
  ascend:
    description: 'Ascend held Eternal equipment'
  community:
    description: 'View community goals'
  supplydrop:
    description: 'Call a supply drop nearby'
    permission: esnsmp.admin
  merchant:
    description: 'View the Mystery Merchant'
  endless:
    description: 'Start an Endless Trial'
  fishingevent:
    description: 'View fishing event information'

  runeforge:
    description: 'Socket Elite Runes into equipment'
  setbonus:
    description: 'View Eternal armor set bonuses'

  mastery:
    description: 'View Realm mastery progression'
  codex:
    description: 'View discovered ESN boss progression'
  pets:
    description: 'View boss pet information'
  treasure:
    description: 'View treasure system information'
  progression:
    description: 'View the ESN RPG progression path'
  diagnostics:
    description: 'Run ESN system diagnostics'
    permission: esnsmp.admin
  admin:
    aliases: [adminmenu, esnadmin]
    description: 'Open the ESN Admin Control Center / moderation menu'
    permission: esnsmp.admin
  modmenu:
    aliases: [staffmenu, mod]
    description: 'Open the ESN moderation menu'
    permission: esnsmp.staff

  jail:
    description: Open the ESN prison control menu or issue a timed sentence.
    usage: /jail [player] [cell] [30m|2h|1d|release]
    permission: esnsmp.staff

  stall:
    aliases: [marketstall, stalls]
    description: 'Rent, stock, and browse ESN player marketplace stalls'
    usage: '/stall <browse|rent|setprice|close>'
  blackmarket:
    aliases: [bm]
    description: 'Open the rotating ESN Black Market'
  backpack:
    aliases: [bp]
    description: 'Create or open an ESN backpack'
  bunker:
    description: 'Generate an ESN secret bunker beneath you'
    permission: esnsmp.admin

  bosscodex:
    description: 'View the persistent boss codex'
  skilltree:
    description: 'View RPG skill tree progression'
  contracts2:
    description: 'View advanced weekly contracts'
  gearupgrade:
    description: 'Evolve held equipment'
  seasonpass:
    description: 'View RPG season progression'
  rpgprofile:
    description: 'View detailed RPG profile'
  rotation:
    description: 'View current progression rotation'
  bosssummon:
    description: 'Consume a Nether Star to summon a Titan boss'
  bossdiag:
    description: 'Run boss-system diagnostics'
    permission: esnsmp.admin

  adventure:
    description: 'View the ESN Adventure Engine'
  class:
    description: 'Choose an ESN combat class'
  ultimate:
    description: 'Activate your charged class ultimate'
  rift:
    description: 'Start a Rift encounter'
  bossrush:
    description: 'Start a five-boss rush'
  records:
    description: 'View persistent ESN server records'
  guild:
    description: 'Manage adventure guild progression'
  trophies:
    description: 'View your trophy room'

  bountyboard:
    description: 'View your rotating adventure bounty'
  hunt:
    description: 'Start a Mythic Hunt'
  artifactfusion:
    description: 'Fuse matching ESN rarity artifacts'
  adventureachievements:
    description: 'View adventure achievements'
  revive:
    description: 'Revive a nearby downed teammate'

  storeclaim:
    description: 'Claim pending paid ESN Store purchases'
    permission: esnsmp.store.claim
  storestatus:
    description: 'View ESN Store Stripe bridge status'
    permission: esnsmp.store.admin

permissions:
  esnsmp.owner:
    default: op
  esnsmp.staff.helper:
    default: false
  esnsmp.staff.trialmod:
    default: false
  esnsmp.staff.moderator:
    default: false
  esnsmp.staff.seniormod:
    default: false
  esnsmp.staff.admin:
    default: false
  esnsmp.spawn:
    default: true
  esnsmp.auction:
    default: true
  esnsmp.economy:
    default: true
  esnsmp.claim:
    default: true
  esnsmp.claim.bypass:
    default: op
  esnsmp.anticheat.alerts:
    default: op
  esnsmp.items:
    default: op
  esnsmp.admin:
    default: op
  esnsmp.spawn.bypass:
    default: op
  esnsmp.staff:
    default: op
  esnsmp.chat.color:
    default: op
  esnsmp.chat.mention:
    default: true
  esnsmp.store.claim:
    default: true
  esnsmp.store.admin:
    default: op
