  realmstaff:
    description: 'Open ESN Realms staff operations'
    usage: '/realmstaff [boss|reset|evacuate|buildlock|perf|decorate]'
  staffrank:
    description: 'View or manage ESN staff ranks'
    usage: '/staffrank [set <player> <rank>]'
  studio:
    description: 'View and manage ESN Studios roles and realm assignments'
    usage: '/studio [list|role|realm]'
  emergency:
    description: 'ESN emergency server controls'
    usage: '/emergency <chat|realms|pvp|trades|economy|events|maintenance|spawnall>'
  stafflist:
    aliases: [teamlist]
    description: 'Show online ESN staff and Studios team members'

