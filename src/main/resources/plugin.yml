name: ESNSMP
version: '1.9.0'
main: com.esn.smp.ESNSMPPlugin
api-version: '1.21'
author: ESN
description: ESN SMP core, massive spawn, economy and auction house

commands:
  spawn:
    description: Teleport to ESN SMP spawn.
    permission: esnsmp.spawn
  setspawn:
    description: Set ESN SMP spawn.
    permission: esnsmp.admin
  esnspawn:
    description: Manage the ESN SMP spawn.
    usage: /esnspawn <build|rebuild|status|rollback>
    permission: esnsmp.admin
  ah:
    aliases: [auction, auctionhouse]
    description: Open and manage the ESN Auction House.
    usage: /ah [sell <price>|cancel <id>|claim]
    permission: esnsmp.auction
  balance:
    aliases: [bal, money]
    description: View your ESN Coin balance.
    permission: esnsmp.economy
  pay:
    description: Pay ESN Coins to another online player.
    usage: /pay <player> <amount>
    permission: esnsmp.economy

  menu:
    description: 'Open ESN SMP menu'
  shop:
    description: 'Open ESN server shop'
  crates:
    description: 'Open ESN loot crates'
  daily:
    description: 'Claim daily ESN reward'
  quests:
    description: 'View ESN quests'
  leaderboard:
    description: 'View ESN leaderboard'
    aliases:
      - top
  warps:
    description: 'List server warps'
  warp:
    description: 'Teleport to a server warp'
    usage: '/warp <name>'
  setwarp:
    description: 'Set a server warp'
    usage: '/setwarp <name>'
    permission: esnsmp.admin
  delwarp:
    description: 'Delete a server warp'
    usage: '/delwarp <name>'
    permission: esnsmp.admin
  sethome:
    description: 'Set a home'
    usage: '/sethome [name]'
  home:
    description: 'Teleport home'
    usage: '/home [name]'
  delhome:
    description: 'Delete a home'
    usage: '/delhome [name]'
  homes:
    description: 'List your homes'
  rtp:
    description: 'Random teleport'
  profile:
    description: 'View your ESN profile'

  level:
    description: 'View ESN level and rank'
  achievements:
    description: 'View ESN achievements'
  streak:
    description: 'View daily login streak'
  team:
    description: 'Manage ESN teams'
    usage: '/team <create|join|leave|info>'
  bounty:
    description: 'View or place player bounties'
    usage: '/bounty [player] [coins]'
  trade:
    description: 'Securely trade held items'
    usage: '/trade <player>'
  grave:
    description: 'View your last death location'
  season:
    description: 'View ESN season progress'
  event:
    description: 'View the current ESN event'
  staff:
    description: 'Open ESN staff command help'
    permission: esnsmp.staff
  invsee:
    description: 'View a player''s inventory'
    permission: esnsmp.staff
  ecsee:
    description: 'View a player''s ender chest'
    permission: esnsmp.staff
  freeze:
    description: 'Freeze a player'
    permission: esnsmp.staff
  warn:
    description: 'Warn a player'
    permission: esnsmp.staff
  mute:
    description: 'Mute a player'
    permission: esnsmp.staff
  history:
    description: 'View moderation history'
    permission: esnsmp.staff

  esnitems:
    description: Give ESN custom items and crate keys.
    usage: /esnitems <item>
    permission: esnsmp.items

  claim:
    description: Protect your base from griefing and theft.
    usage: /claim <pos1|pos2|create|remove|trust|untrust|info>
    permission: esnsmp.claim

  tpa:
    description: 'Request teleport to a player'
    usage: '/tpa <player>'
  tpahere:
    description: 'Send a teleport request'
    usage: '/tpahere <player>'
  tpaccept:
    description: 'Accept a teleport request'
  tpdeny:
    description: 'Deny a teleport request'
  back:
    description: 'Return to your previous teleport location'
  tptoggle:
    description: 'Toggle incoming teleport requests'

  pass:
    description: 'Open the ESN Season Pass'
  upgrade:
    description: 'Upgrade the ESN item in your hand'
  tradegui:
    description: 'Open secure player trading'
    usage: '/tradegui <player>'
  tutorial:
    description: 'View the ESN SMP quick-start tutorial'

permissions:
  esnsmp.spawn:
    default: true
  esnsmp.auction:
    default: true
  esnsmp.economy:
    default: true
  esnsmp.claim:
    default: true
  esnsmp.claim.bypass:
    default: op
  esnsmp.anticheat.alerts:
    default: op
  esnsmp.items:
    default: op
  esnsmp.admin:
    default: op
  esnsmp.spawn.bypass:
    default: op
  esnsmp.staff:
    default: op
