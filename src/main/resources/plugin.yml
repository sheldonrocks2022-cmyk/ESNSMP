  case:
    description: 'View and manage ESN moderation cases'
    usage: '/case <id|create|note|close>'
    permission: esnsmp.staff
  cases:
    description: 'View recent ESN moderation cases'
    usage: '/cases [player]'
    permission: esnsmp.staff
  evidence:
    description: 'Capture investigation evidence'
    usage: '/evidence <start player|stop|discard|status>'
