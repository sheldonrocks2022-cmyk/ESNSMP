  adventure:
    description: 'View the ESN Adventure Engine'
  class:
    description: 'Choose an ESN combat class'
  ultimate:
    description: 'Activate your charged class ultimate'
  rift:
    description: 'Start a Rift encounter'
  bossrush:
    description: 'Start a five-boss rush'
  records:
    description: 'View persistent ESN server records'
  guild:
    description: 'Manage adventure guild progression'
  trophies:
    description: 'View your trophy room'

  bountyboard:
    description: 'View your rotating adventure bounty'
  hunt:
    description: 'Start a Mythic Hunt'
  artifactfusion:
    description: 'Fuse matching ESN rarity artifacts'
  adventureachievements:
    description: 'View adventure achievements'
  revive:
    description: 'Revive a nearby downed teammate'

  storeclaim:
    description: 'Claim pending paid ESN Store purchases'
    permission: esnsmp.store.claim
  storestatus:
    description: 'View ESN Store Stripe bridge status'
    permission: esnsmp.store.admin


  fun:
    aliases: [activities, funhub]
    description: 'Open the ESN Fun Hub'
  dailycontracts:
    aliases: [dcontracts]
    description: 'Open daily ESN contracts'
  ascension:
    aliases: [asc]
    description: 'View player Ascension progression'
  reputation:
    aliases: [rep]
    description: 'View ESN reputation'
  mount:
    description: 'Summon or dismiss your ESN mount'
  parkour:
    description: 'Start the ESN Parkour Tower'
  maze:
    description: 'Start the procedural ESN Maze'
  temple:
    description: 'Start the ESN puzzle temple'
  secretboss:
    description: 'Awaken the hidden ESN boss with lore fragments'
  duel:
    description: 'Challenge another player to a duel'
    usage: '/duel <player> [coins] | /duel accept | /duel deny'
  tournament:
    description: 'Join or manage ESN tournaments'
    usage: '/tournament <join|leave|status|start>'
  matchmaking:
    description: 'Toggle duel matchmaking'
  predict:
    description: 'Predict the winner of the active tournament match'
    usage: '/predict <player>'
  killcam:
    description: 'Show your last combat death recap'
  damagemeter:
    description: 'Toggle the boss damage meter'
  market:
    description: 'Open the dynamic ESN market'
  arcade:
    description: 'Open ESN Coin arcade games'
  vote:
    description: 'View your ESN voting streak'
  votecredit:
    description: 'Credit a verified server-list vote'
    usage: '/votecredit <player>'
