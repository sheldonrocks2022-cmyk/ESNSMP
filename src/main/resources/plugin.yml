name: ESNSMP
version: 1.5.0
main: com.esn.smp.ESNSMPPlugin
api-version: '1.21'
author: ESN
description: ESN SMP core, massive spawn, economy and auction house

commands:
  spawn:
    description: Teleport to ESN SMP spawn.
    permission: esnsmp.spawn
  setspawn:
    description: Set ESN SMP spawn.
    permission: esnsmp.admin
  esnspawn:
    description: Manage the ESN SMP spawn.
    usage: /esnspawn <build|rebuild|status|rollback>
    permission: esnsmp.admin
  ah:
    aliases: [auction, auctionhouse]
    description: Open and manage the ESN Auction House.
    usage: /ah [sell <price>|cancel <id>|claim]
    permission: esnsmp.auction
  balance:
    aliases: [bal, money]
    description: View your ESN Coin balance.
    permission: esnsmp.economy
  pay:
    description: Pay ESN Coins to another online player.
    usage: /pay <player> <amount>
    permission: esnsmp.economy

  menu: {description: Open ESN SMP menu}
  shop: {description: Open ESN server shop}
  crates: {description: Open ESN loot crates}
  daily: {description: Claim daily ESN reward}
  quests: {description: View ESN quests}
  leaderboard: {description: View ESN leaderboard, aliases: [top]}
  warps: {description: View ESN warps}

  esnitems:
    description: Give ESN custom items and crate keys.
    usage: /esnitems <item>
    permission: esnsmp.items

  claim:
    description: Protect your base from griefing and theft.
    usage: /claim <pos1|pos2|create|remove>
    permission: esnsmp.claim

  tpa: {description: Request teleport to a player, usage: /tpa <player>}
  tpahere: {description: Send a teleport request, usage: /tpahere <player>}
  tpaccept: {description: Accept a teleport request}
  tpdeny: {description: Deny a teleport request}
  back: {description: Return to your previous teleport location}

permissions:
  esnsmp.spawn:
    default: true
  esnsmp.auction:
    default: true
  esnsmp.economy:
    default: true
  esnsmp.claim:
    default: true
  esnsmp.claim.bypass:
    default: op
  esnsmp.anticheat.alerts:
    default: op
  esnsmp.items:
    default: op
  esnsmp.admin:
    default: op
  esnsmp.spawn.bypass:
    default: op
