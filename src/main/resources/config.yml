spawn:
  world: world
  x: 0.5
  y: 80.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  configured: false
  generated: false
  build-incomplete: false
  design-version: 3
  build-on-first-start: true
  protection-radius: 2000
  teleport-new-players: true
  teleport-on-respawn: true
  disable-pvp: true
  disable-hostile-spawns: true
  disable-explosions: true

economy:
  starting-balance: 500

auction:
  max-listings-per-player: 10
  max-price: 1000000000

branding:
  title: "&6&lESN &f&lSMP"
  subtitle: "&7Survive • Build • Become Legendary"
  welcome-message: "&8[&6ESN&8] &fWelcome to &6ESN SMP&f!"

stripe-store:
  # Direct server-side Stripe polling. Keep this false until the key and product mappings are configured.
  enabled: false
  # Prefer the STRIPE_SECRET_KEY environment variable when available. Never put this key on the public website.
  secret-key: ""
  poll-interval-seconds: 30
  username-field-key: "minecraft_username"
  username-field-label: "Minecraft Username"
  # Automatically set the first time the bridge is enabled so old historical payments are not delivered.
  activation-time: 0
  # Map either a Stripe Payment Link ID (plink_...) or metadata esn_product value to an ESN item.
  # Example:
  # products:
  #   plink_example:
  #     item-id: "realm001key"
  #     amount: 5
  products: {}
